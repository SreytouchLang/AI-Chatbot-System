  <text x="545" y="476" fill="#B9C0C6" font-size="18" font-family="Arial, sans-serif" letter-spacing="1">ASSISTANT</text>
  <text x="598" y="525" fill="#F6F7F8" font-size="28" font-family="Arial, sans-serif">Upload a document, voice note, or video, then ask</text>
