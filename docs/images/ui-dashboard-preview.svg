  <text x="552" y="540" fill="#BFC6CC" font-size="18" font-family="Arial, sans-serif" letter-spacing="1">ASSISTANT</text>
  <text x="612" y="580" fill="#F6F7F8" font-size="22" font-family="Arial, sans-serif">Upload a document, voice note, or video.</text>
