  <text x="560" y="328" fill="#F4F7F8" font-size="29" font-family="Arial, sans-serif">Answers stay grounded in sources on the right.</text>

  <rect x="648" y="374" width="418" height="98" rx="22" fill="#121B24" stroke="#203341"/>
  <text x="674" y="405" fill="#BBC3C9" font-size="18" font-family="Arial, sans-serif" letter-spacing="1">YOU</text>
  <text x="674" y="446" fill="#EFF3F6" font-size="24" font-family="Arial, sans-serif">Summarize the payment terms from the uploaded files.</text>

  <rect x="504" y="494" width="520" height="120" rx="22" fill="#18222B" stroke="#203341"/>
  <text x="528" y="526" fill="#BBC3C9" font-size="18" font-family="Arial, sans-serif" letter-spacing="1">ASSISTANT</text>
  <text x="528" y="566" fill="#EFF3F6" font-size="23" font-family="Arial, sans-serif">Standard invoices are due within 30 days of issue date.</text>
  <text x="528" y="598" fill="#EFF3F6" font-size="23" font-family="Arial, sans-serif">Enterprise terms require prior approval and may extend payment.</text>

