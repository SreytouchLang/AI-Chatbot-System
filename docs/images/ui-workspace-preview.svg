  <rect x="1160" y="214" width="322" height="126" rx="22" fill="#16212B" stroke="#203341"/>
  <text x="1184" y="246" fill="#53D1E6" font-size="16" font-family="Arial, sans-serif" letter-spacing="1">CONVERSATION SUMMARY</text>
  <text x="1184" y="288" fill="#ECF1F4" font-size="22" font-family="Arial, sans-serif">User is reviewing payment timing across a</text>
  <text x="1184" y="318" fill="#ECF1F4" font-size="22" font-family="Arial, sans-serif">policy document and transcribed meeting notes.</text>

  <rect x="1160" y="362" width="322" height="142" rx="22" fill="#121B24" stroke="#203341"/>
  <text x="1184" y="394" fill="#C2CAD1" font-size="16" font-family="Arial, sans-serif">SOURCE 1  -  DOCX</text>
  <text x="1184" y="430" fill="#F5F7F8" font-size="24" font-family="Arial, sans-serif">support-policy.docx</text>
  <text x="1184" y="468" fill="#D7DFE6" font-size="20" font-family="Arial, sans-serif">Payment invoices are due within 30 calendar days</text>
  <text x="1184" y="496" fill="#D7DFE6" font-size="20" font-family="Arial, sans-serif">unless alternative terms are agreed in writing.</text>

  <rect x="1160" y="526" width="322" height="142" rx="22" fill="#121B24" stroke="#203341"/>
  <text x="1184" y="558" fill="#C2CAD1" font-size="16" font-family="Arial, sans-serif">SOURCE 2  -  MEDIA TRANSCRIPT</text>
  <text x="1184" y="594" fill="#F5F7F8" font-size="24" font-family="Arial, sans-serif">meeting-notes-q2.mov</text>
  <text x="1184" y="632" fill="#D7DFE6" font-size="20" font-family="Arial, sans-serif">Finance noted that enterprise customers can</text>
  <text x="1184" y="660" fill="#D7DFE6" font-size="20" font-family="Arial, sans-serif">receive longer terms only after approval.</text>
