  <rect x="504" y="214" width="562" height="132" rx="20" fill="#232627" stroke="#414546"/>
  <text x="528" y="244" fill="#BBC3C9" font-size="18" font-family="Arial, sans-serif" letter-spacing="1">ASSISTANT</text>
