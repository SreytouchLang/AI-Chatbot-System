  <text x="142" y="710" fill="#D6EEF5" font-size="22" font-family="Arial, sans-serif">Stored 18 chunks from meeting-notes-q2.mov</text>

  <text x="504" y="124" fill="#53D1E6" font-size="18" font-family="Arial, sans-serif" letter-spacing="2">CONVERSATION</text>
